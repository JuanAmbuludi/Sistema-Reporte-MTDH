name: Validar bases Excel ENOS
on:
  push:
    paths: ['data/enos_excel/*.xlsx', 'data/processed/brigadas_emergencia.json', 'data/processed/alertas_historicas.json', 'data/processed/seguimiento_enos_*.json', 'data/processed/continuidad_servicios_*.json', 'src/enos*.py', 'scripts/ingesta_enos_excel.py', 'scripts/validar_enos_excel.py', 'scripts/actualizar_sello_enos.py', 'tests/test_enos_excel.py', '.github/workflows/validar-enos-excel.yml']
  pull_request:
    paths: ['data/enos_excel/*.xlsx', 'data/processed/brigadas_emergencia.json', 'data/processed/alertas_historicas.json', 'data/processed/seguimiento_enos_*.json', 'data/processed/continuidad_servicios_*.json', 'src/enos*.py', 'scripts/ingesta_enos_excel.py', 'scripts/validar_enos_excel.py', 'scripts/actualizar_sello_enos.py', 'tests/test_enos_excel.py', '.github/workflows/validar-enos-excel.yml']
permissions:
  contents: write
concurrency:
  group: sello-enos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 openpyxl==3.1.5
      - run: python scripts/validar_enos_excel.py
      - run: python -m unittest discover -s tests -p test_enos_excel.py
      - name: Actualizar fecha y hora de publicación de los Excel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/actualizar_sello_enos.py
          git add data/enos_excel/actualizacion.json data/enos_excel/validado.json.gz
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar fecha y hora de publicación ENOS"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
