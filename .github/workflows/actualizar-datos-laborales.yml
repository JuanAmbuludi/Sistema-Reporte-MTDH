name: Actualizar datos laborales
on:
  workflow_dispatch:
  schedule:
    # 07:15 Ecuador (UTC-5). Source dates, not execution dates, key the history.
    - cron: '15 12 * * *'
permissions:
  contents: write
concurrency:
  group: actualizacion-datos-laborales
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt pytest
      - run: python scripts/update_history.py --web
      - run: python -m pytest tests/test_history.py -q
      - name: Guardar solo cambios de datos validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series data/processed/gestion_laboral.parquet data/processed/manifest_laboral.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar corte publicado de datos laborales"
            git push
          fi
