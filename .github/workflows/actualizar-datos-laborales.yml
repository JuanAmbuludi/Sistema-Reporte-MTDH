name: Actualizar datos laborales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actualizar-datos-laborales.yml'
      - 'scripts/update_history.py'
      - 'src/sgde_scraper.py'
      - 'requirements-data.txt'
      - 'tests/test_daily_labour.py'
  schedule:
    # 07:15 Ecuador (UTC-5). Source dates, not execution dates, key the history.
    - cron: '15 12 * * *'
permissions:
  contents: write
concurrency:
  group: actualizacion-datos-laborales
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Instalar dependencias de extracción
        run: pip install -r requirements-data.txt pytest
      - name: Consultar fuentes públicas y validar el corte
        run: python scripts/update_history.py --web > /tmp/laboral-update.json
      - name: Validar datos y actualización automática
        run: python -m pytest tests/test_history.py tests/test_daily_labour.py -q
      - name: Guardar solo cambios de datos validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series data/processed/gestion_laboral.parquet data/processed/manifest_laboral.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar corte publicado de datos laborales"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Resumen de la consulta publicada
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          status = json.loads(Path('data/series/laboral/ultima_consulta.json').read_text())
          checks = json.loads(Path('data/series/actualizacion.json').read_text())['controles']['contratos']
          consulted = datetime.fromisoformat(status['consulta_utc']).astimezone(ZoneInfo('America/Guayaquil'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Consulta validada: {consulted:%d/%m/%Y %H:%M} (Ecuador)\n\n")
              out.write(f"Corte publicado por la fuente: {checks.get('fecha_hora_corte') or checks['fecha_corte']}\n\n")
              out.write(f"Contratos vigentes: {checks['por_estado'].get('Vigente', 0):,}\n\n")
              out.write('Frecuencia: diaria, programada a las 07:15 de Ecuador.\n')
          PY
